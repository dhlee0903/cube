name: 배포

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages는 저장소 설정에서 사람이 한 번 켜 줘야 한다(자동화 토큰에는 그 권한이 없다).
      # 아직 꺼져 있으면 배포만 건너뛴다.
      - uses: actions/configure-pages@v5
        id: configure
        continue-on-error: true

      - name: Pages가 꺼져 있으면 알리기
        if: steps.configure.outcome != 'success'
        run: echo "::warning::GitHub Pages가 아직 꺼져 있어 배포를 건너뜁니다. Settings → Pages → Source를 'GitHub Actions'로 바꾼 뒤 다시 실행하세요."

      - id: deployment
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v4
